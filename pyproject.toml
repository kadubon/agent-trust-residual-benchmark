[project]
name = "agent-trust-residual-benchmark"
version = "0.1.0"
description = "A reproducible AI-agent benchmark for trust, evidence, authority, provenance, temporal claims, and residual handling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agent Trust and Residual Benchmark contributors" }]
keywords = [
    "ai-agents",
    "ai-safety",
    "benchmark",
    "llm-evaluation",
    "ollama",
    "provenance",
    "reproducibility",
    "trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.1,<1",
    "jsonschema>=4.25.1,<5",
    "pydantic>=2.12.0,<3",
    "rich>=14.2.0,<15",
    "typer>=0.21.0,<1",
]

[project.urls]
Homepage = "https://github.com/kadubon/agent-trust-residual-benchmark"
Documentation = "https://github.com/kadubon/agent-trust-residual-benchmark/tree/main/docs"
Repository = "https://github.com/kadubon/agent-trust-residual-benchmark"
Issues = "https://github.com/kadubon/agent-trust-residual-benchmark/issues"
Changelog = "https://github.com/kadubon/agent-trust-residual-benchmark/blob/main/CHANGELOG.md"

[project.scripts]
atrb = "atrb.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.0,<2",
    "pytest>=9.0.0,<10",
    "ruff>=0.14.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atrb"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true
